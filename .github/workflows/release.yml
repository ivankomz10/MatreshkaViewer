name: Release

# Build the viewer on real Windows and macOS machines and publish the results
# as a GitHub Release. PyInstaller does not cross-compile, so each binary has
# to be built on its own kind of machine; GitHub's hosted runners are those
# machines.
#
# Two ways to fire it, both fully automatic -- no manual asset upload:
#   * push a tag like `v0.2`  -> release is cut for that tag;
#   * Actions tab -> Release -> "Run workflow" -> a release is cut too, tagged
#     from the `version` input, or, left blank, from APP_VERSION in main.py.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v0.2 (blank = APP_VERSION from tool/main.py)'
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Work out the tag once, so a tag push and a manual run land on the same name.
  version:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            tag="${{ github.event.inputs.version }}"
          else
            ver="$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' tool/main.py)"
            if [ -z "$ver" ]; then
              echo "Could not read APP_VERSION from tool/main.py" >&2
              exit 1
            fi
            tag="v${ver}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

  windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The same steps build.bat runs, minus its `pause` (which would hang a
      # non-interactive runner). The spec writes MatreshkaViewer.exe one level
      # up from the tool folder, i.e. the repository root.
      - name: Build
        working-directory: tool
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt
          .venv\Scripts\pip install pyinstaller
          .venv\Scripts\pyinstaller --noconfirm --distpath .. --workpath build build.spec

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path MatreshkaViewer.exe -DestinationPath MatreshkaViewer-windows.zip

      - uses: actions/upload-artifact@v7
        with:
          name: MatreshkaViewer-windows
          path: MatreshkaViewer-windows.zip
          if-no-files-found: error

  macos:
    name: Build macOS (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # build.sh makes its own venv, installs the requirements, and runs the
      # spec, which on macOS produces MatreshkaViewer.app (a folder) at the
      # repository root. ditto zips it while keeping the bundle's symlinks and
      # metadata, which a plain zip would flatten.
      - name: Build
        working-directory: tool
        run: bash build.sh

      - name: Package
        run: ditto -c -k --keepParent MatreshkaViewer.app MatreshkaViewer-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: MatreshkaViewer-macos
          path: MatreshkaViewer-macos.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Creates the tag if it does not exist yet (manual runs), or reuses it
      # (tag pushes), and attaches both zips. Re-running the same version
      # refreshes that release rather than making a second one.
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: dist/*.zip
          draft: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
